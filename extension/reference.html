<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lossless PDF reference</title><link rel="stylesheet" href="pdf_viewer.css"><link rel="stylesheet" href="reference.css"></head><body>
<header><strong>Lossless · PDF reference</strong><button id="back">Back to chat</button></header>
<main><section class="controls"><h1>Choose what must stay.</h1><p id="linked">Linking to your conversation…</p><label>Open a PDF from your device<input type="file" id="file" accept="application/pdf,.pdf"></label><p class="hint">The PDF stays on your device. Selected passages are included only when you explicitly send with Lossless in the linked chat.</p><div class="nav"><button id="prev" disabled>Previous</button><span id="page-number">No PDF open</span><button id="next" disabled>Next</button></div><p id="status" role="status">Select text on a PDF page, then choose how to keep it.</p><textarea id="selected" aria-label="Selected PDF passage" readonly placeholder="Your selected passage appears here."></textarea><div class="nav"><button id="meaning" disabled>Keep meaning</button><button id="wording" disabled>Keep wording</button></div><div id="kept"></div></section><section class="document"><div id="page"><canvas></canvas><div class="textLayer"></div></div></section></main><script type="module" src="reference.js"></script></body></html>
