<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local extension interaction test</title><style>
body{font:16px/1.5 system-ui;background:#f9f9f7;color:#252721;margin:0}main{max-width:760px;margin:35px auto;padding:20px}h1{font-size:24px}form{position:fixed;bottom:45px;left:calc(50% - 340px);width:680px;padding:16px;background:white;border:1px solid #bbb;border-radius:14px}textarea,[contenteditable]{font:inherit;display:block;padding:12px;width:calc(100% - 24px);min-height:85px;white-space:pre-wrap}button{padding:10px 18px;margin:8px 0}article{white-space:pre-wrap;padding:12px;border:1px solid #ddd;max-height:270px;overflow:auto}@media(max-width:720px){form{left:16px;width:calc(100% - 64px)}}
</style><main><h1>Local extension interaction test</h1><p>Synthetic chat page. This tests the real content-script bundle with simulated Chrome permissions. No model is called.</p><label><input id="rich" type="checkbox"> Use a contenteditable composer</label><p id="count">Messages sent: 0</p><article id="sent">Nothing sent.</article></main><form><textarea aria-label="Chat request" placeholder="Write a request"></textarea><button type="submit" aria-label="Send message">Send</button></form><script>
const listeners = []; let sent = 0;
window.chrome = {runtime:{id:'fixture',sendMessage:async message=>message.kind==='inline-access'?{allowed:true}:{},onMessage:{addListener:fn=>listeners.push(fn),removeListener:fn=>{const i=listeners.indexOf(fn);if(i>=0)listeners.splice(i,1);}}}};
document.querySelector('form').onsubmit=e=>{e.preventDefault(); const input=document.querySelector('form textarea,form [contenteditable]');document.querySelector('#sent').textContent=input.value??input.innerText;document.querySelector('#count').textContent='Messages sent: '+(++sent); if('value'in input)input.value='';else input.innerText='';};
document.querySelector('#rich').onchange=e=>{const old=document.querySelector('form textarea,form [contenteditable]'), next=document.createElement(e.target.checked?'div':'textarea');next.setAttribute('aria-label','Chat request');if(e.target.checked){next.setAttribute('contenteditable','true');next.setAttribute('role','textbox');next.innerText=old.value;}else next.value=old.innerText;old.replaceWith(next);};
</script><script src="content.js"></script></html>
